<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/header.css"/>
    <link rel="stylesheet" href="assets/css/main.css"/>
    <script src="assets/js/script.js" defer></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="assets/js/script.js"></script>

</head>
<body>
    <header class="container-fluid">
        <div class="bank-company">
            <img src="" />
            <h1>MyBank</h1>
        </div>
        <div class="menus">
            <nav>
                <li>Accounts</li>
                <li>Transfers</li>
                <li>Payments</li>
                <li>Statements</li>
            </nav>
        </div>
        <div class="profile">
            <img src="https://app-companion-430619.appspot.com/static/stitch-avatar.png"/>
        </div>
    </header>
    <main>
        <div class="account">
            <section class="account-header">
                <h1>Account Dashboard</h1>
                <p class="form-control text-center">Welcome to MyBank</p>
            </section>
            <section class="account-balance">
                <label for="amount">Current Balance: $<span id="current-balance" style="background-color: white; border: none;">2000</span></label>
                <br/>
                <input class="form-control" type="number" id="amount" placeholder="$5,000.50" min="100" >
            </section>
            <section class="account-operation">
                <div class="sub-operation">
                    <button class="btn btn-success btn-deposit" onclick="depositOperation()">Deposit</button>
                    <button class="btn btn-danger btn-withdraw" onclick="withDrawOperation()">Withdraw</button>
                    <button class="btn btn-danger btn-reset" onclick="reset()">Reset</button>
                    <p class="form-control text-center error-message md-100">---</p>
                    <div class="account-history">
                        <a class="form-control text-center text-decoration-none" id="current-transaction-link" href="#">Current Transaction</a>
                        <table class="table">
                            <thead>
                            <tr>
                                <th>Date</th>
                                <th>Type</th>
                                <th>Amount</th>
                            </tr>
                            </thead>
                            <tbody id="last-transaction">
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
            <section class="account-transaction">
                <button class="btn btn-success btn-transaction" id="view-transaction-history-btn"
                        onclick="viewTransaction()">All Transaction History</button>
                <div class="transaction-history">
                    <br/>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Type</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-table">
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
