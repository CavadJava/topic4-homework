<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/header.css"/>
    <link rel="stylesheet" href="assets/css/main.css"/>
    <script src="assets/js/script.js" defer></script>
</head>
<body>
    <header>
        <div class="bank-company">
            <img src="" />
            <h1>MyBank</h1>
        </div>
        <div class="menus">
            <nav>
                <li>Accounts</li>
                <li>Transfers</li>
                <li>Payments</li>
                <li>Statements</li>
            </nav>
        </div>
        <div class="profile">
            <img src="https://app-companion-430619.appspot.com/static/stitch-avatar.png"/>
        </div>
    </header>
    <main>
        <div class="account">
            <section class="account-header">
                <h1>Account Dashboard</h1>
                <p>Welcome back, John Doe</p>
            </section>
            <section class="account-balance">
                <label for ="current-balance">Current Balance: $1000</label>
                <br/>
                <input type="number" id="current-balance" placeholder="$5,000.50" min="100">
            </section>
            <section class="account-operation">
                <button class="btn-deposit">Deposit</button>
                <button class="btn-withdraw">Withdraw</button>
            </section>
            <section class="account-transaction">
                <button class="btn-transaction">View Transaction History Open/Hidden</button>
                <div class="transaction-history">
                    <p>Transaction History</p>
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Type</th>
                                <th>Description</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
